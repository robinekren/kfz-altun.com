<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KFZ Altun bewerten | Google Bewertung</title>
<meta name="description" content="Waren Sie zufrieden mit KFZ Altun in Neunkirchen? Hinterlassen Sie uns eine Bewertung auf Google.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0A0A0A; --card:#161616; --border:#222; --text:#F5F5F5; --muted:#A3A3A3; --red:#DC2626; --red-dark:#B91C1C; --gold:#FBBC04; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; min-height:100dvh; background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--border); border-radius:24px; padding:40px 28px 32px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .logo { display:inline-flex; align-items:center; gap:10px; font-weight:700; letter-spacing:2px; font-size:18px; margin-bottom:28px; }
  .logo img { height:40px; width:auto; }
  h1 { font-family:'Playfair Display',Georgia,serif; font-size:32px; line-height:1.15; margin-bottom:12px; }
  h1 span { color:var(--red); }
  p { color:var(--muted); font-size:16px; line-height:1.55; }
  .stars { display:flex; justify-content:center; gap:6px; margin:28px 0; }
  .stars svg { width:44px; height:44px; fill:var(--gold); }
  .btn { display:flex; align-items:center; justify-content:center; gap:12px; width:100%; padding:18px 20px; border-radius:14px; font-size:17px; font-weight:600; text-decoration:none; transition:transform .15s, background .15s; }
  .btn:active { transform:scale(.98); }
  .btn-google { background:#fff; color:#111; }
  .btn-google svg { width:22px; height:22px; }
  .btn-google.wait { background:#2a2a2a; color:var(--muted); pointer-events:none; }
  .btn-ghost { margin-top:12px; color:var(--muted); border:1px solid var(--border); font-size:15px; padding:14px 20px; }
  .hint { margin-top:22px; font-size:13px; color:#666; }
</style>
</head>
<body>
<main class="card">
  <div class="logo">
    <img src="/img/logo.svg" alt="KFZ Altun Logo" width="94" height="40">
    KFZ ALTUN
  </div>
  <h1>Danke für Ihr <span>Vertrauen</span></h1>
  <p>Waren Sie zufrieden mit uns? Eine kurze Bewertung auf Google hilft unserem Familienbetrieb in Neunkirchen sehr.</p>
  <div class="stars" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
  </div>
  <a id="reviewBtn" class="btn btn-google" href="#" rel="noopener">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
    Jetzt auf Google bewerten
  </a>
  <a class="btn btn-ghost" href="https://wa.me/436607036723" target="_blank" rel="noopener">Fragen? Schreiben Sie uns auf WhatsApp</a>
  <p class="hint">Dauert weniger als eine Minute</p>
</main>
<script>
  // Google-Bewertungslink aus dem Unternehmensprofil (Rezensionen erhalten → Link kopieren)
  const REVIEW_URL = '';
  const btn = document.getElementById('reviewBtn');
  function setWaiting() {
    btn.classList.add('wait');
    btn.lastChild.textContent = ' Google-Bewertung in Kürze verfügbar';
  }
  if (REVIEW_URL) {
    btn.href = REVIEW_URL;
  } else {
    // Fallback: Link aus GOOGLE_PLACE_ID (Vercel-Env) über /api/review-link
    btn.classList.add('wait');
    fetch('/api/review-link')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && typeof d.url === 'string' && d.url.indexOf('https://search.google.com/') === 0) {
          btn.href = d.url;
          btn.classList.remove('wait');
        } else {
          setWaiting();
        }
      })
      .catch(setWaiting);
  }
</script>
</body>
</html>
